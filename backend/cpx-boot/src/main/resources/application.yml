spring:
  application:
    name: coolpilotx
  datasource:
    url: ${CPX_DB_URL:jdbc:postgresql://127.0.0.1:5432/coolpilotx}
    username: ${CPX_DB_USER:cpx_app}
    password: ${CPX_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      # 时区统一 UTC，日期展示在应用层按 Asia/Shanghai 格式化（ADR-001 A-05）
      connection-init-sql: SET TIME ZONE 'UTC'
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

server:
  port: ${CPX_SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100

logging:
  level:
    root: INFO
    com.coolpilotx: DEBUG
